      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          cd /tmp/project/PinballVisionMVP
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinballVision11374-v14-debug-apk
          path: /tmp/project/PinballVisionMVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
